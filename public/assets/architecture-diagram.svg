<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
  <!-- Background -->
  <rect width="800" height="520" fill="#0f1419" rx="8"/>

  <!-- Consumers -->
  <rect x="180" y="20" width="440" height="60" fill="#1a2027" stroke="#2d3a45" rx="6"/>
  <text x="400" y="42" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">CONSUMERS</text>
  <text x="250" y="62" text-anchor="middle" fill="#e6edf3" font-size="12">CRM</text>
  <text x="400" y="62" text-anchor="middle" fill="#e6edf3" font-size="12">Internal Apps</text>
  <text x="550" y="62" text-anchor="middle" fill="#e6edf3" font-size="12">External Apps</text>

  <!-- Arrow down -->
  <path d="M400 80 L400 110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API Orchestrator -->
  <rect x="150" y="110" width="500" height="200" fill="#1a2027" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="400" y="135" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">API Orchestrator</text>
  <text x="400" y="152" text-anchor="middle" fill="#8b949e" font-size="11">Express + Node.js + TypeScript</text>

  <!-- Route boxes inside -->
  <rect x="175" y="165" width="110" height="50" fill="#232d36" stroke="#2d3a45" rx="4"/>
  <text x="230" y="185" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">/api/*</text>
  <text x="230" y="200" text-anchor="middle" fill="#8b949e" font-size="10">Proxy Router</text>

  <rect x="300" y="165" width="110" height="50" fill="#232d36" stroke="#2d3a45" rx="4"/>
  <text x="355" y="185" text-anchor="middle" fill="#d29922" font-size="11" font-weight="600">/mock/*</text>
  <text x="355" y="200" text-anchor="middle" fill="#8b949e" font-size="10">Mock Router</text>

  <rect x="425" y="165" width="110" height="50" fill="#232d36" stroke="#2d3a45" rx="4"/>
  <text x="480" y="185" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">/admin</text>
  <text x="480" y="200" text-anchor="middle" fill="#8b949e" font-size="10">Admin API</text>

  <rect x="550" y="165" width="85" height="50" fill="#232d36" stroke="#2d3a45" rx="4"/>
  <text x="592" y="185" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">/ui</text>
  <text x="592" y="200" text-anchor="middle" fill="#8b949e" font-size="10">Web UI</text>

  <!-- Engine boxes -->
  <rect x="175" y="230" width="150" height="40" fill="#232d36" stroke="#2d3a45" rx="4"/>
  <text x="250" y="255" text-anchor="middle" fill="#e6edf3" font-size="11">Orchestrator Engine</text>

  <rect x="340" y="230" width="150" height="40" fill="#232d36" stroke="#2d3a45" rx="4"/>
  <text x="415" y="255" text-anchor="middle" fill="#e6edf3" font-size="11">Transformer</text>

  <rect x="505" y="230" width="130" height="40" fill="#232d36" stroke="#2d3a45" rx="4"/>
  <text x="570" y="255" text-anchor="middle" fill="#e6edf3" font-size="11">Auth + Retry</text>

  <!-- Data store -->
  <rect x="175" y="280" width="460" height="20" fill="none" stroke="none"/>
  <text x="400" y="295" text-anchor="middle" fill="#8b949e" font-size="10">Config-driven routing with full logging, audit and rollback</text>

  <!-- Arrows down to backends -->
  <path d="M250 310 L250 350" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M400 310 L400 350" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550 310 L550 350" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backend systems -->
  <rect x="80" y="350" width="640" height="60" fill="#1a2027" stroke="#2d3a45" rx="6"/>
  <text x="400" y="370" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">BACKEND SYSTEMS</text>

  <rect x="120" y="380" width="160" height="24" fill="#232d36" stroke="#3fb950" rx="4"/>
  <text x="200" y="396" text-anchor="middle" fill="#e6edf3" font-size="11">System A</text>

  <rect x="320" y="380" width="160" height="24" fill="#232d36" stroke="#d29922" rx="4"/>
  <text x="400" y="396" text-anchor="middle" fill="#e6edf3" font-size="11">System B</text>

  <rect x="520" y="380" width="160" height="24" fill="#232d36" stroke="#8b949e" rx="4"/>
  <text x="600" y="396" text-anchor="middle" fill="#e6edf3" font-size="11">System (n)</text>

  <!-- Features bar -->
  <rect x="80" y="440" width="640" height="60" fill="#1a2027" stroke="#2d3a45" rx="6"/>
  <text x="400" y="458" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">KEY CAPABILITIES</text>
  <text x="160" y="480" text-anchor="middle" fill="#58a6ff" font-size="10">Multi-step</text>
  <text x="160" y="493" text-anchor="middle" fill="#58a6ff" font-size="10">Orchestration</text>
  <text x="280" y="480" text-anchor="middle" fill="#3fb950" font-size="10">Response</text>
  <text x="280" y="493" text-anchor="middle" fill="#3fb950" font-size="10">Mapping</text>
  <text x="400" y="480" text-anchor="middle" fill="#d29922" font-size="10">Header</text>
  <text x="400" y="493" text-anchor="middle" fill="#d29922" font-size="10">Forwarding</text>
  <text x="520" y="480" text-anchor="middle" fill="#e6edf3" font-size="10">Execution</text>
  <text x="520" y="493" text-anchor="middle" fill="#e6edf3" font-size="10">Logging</text>
  <text x="640" y="480" text-anchor="middle" fill="#f85149" font-size="10">Error Handling</text>
  <text x="640" y="493" text-anchor="middle" fill="#f85149" font-size="10">+ Retry</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
